[project]
name = "catchy-track-app"
version = "0.1.0"
description = "FastAPI backend for folder processing with robust scaffolding"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Your Name" }
]
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.22.0",
  "SQLAlchemy>=2.0.0",
  "pydantic>=2.4.0",
  "pydantic-settings>=2.0.0",
  "python-multipart>=0.0.6",
  "filelock>=3.12.0",
  "selenium>=4.12.0"
]

[project.optional-dependencies]
dev = [
  "black>=23.1.0",
  "isort>=5.12.0",
  "flake8>=6.0.0",
  "pre-commit>=3.3.0",
  "pytest>=7.3.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
exclude = ".venv|build|dist|.git|.mypy_cache|.pytest_cache|.ruff_cache"

[tool.isort]
profile = "black"
line_length = 100

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
exclude = [".venv", "build", "dist", ".git", ".mypy_cache", ".pytest_cache"]
